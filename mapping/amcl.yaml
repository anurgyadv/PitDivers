amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    map_topic: /map
    first_map_only: true
    set_initial_pose: false
    always_reset_initial_pose: true
    tf_broadcast: true
    transform_tolerance: 0.2
    min_particles: 3000
    max_particles: 20000
    max_beams: 180
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 1.5
    laser_min_range: 0.08
    laser_max_range: 6.0
    sigma_hit: 0.12
    z_hit: 0.95
    z_rand: 0.05
    update_min_d: 0.02
    update_min_a: 0.03
    resample_interval: 1
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    alpha1: 0.25
    alpha2: 0.25
    alpha3: 0.25
    alpha4: 0.25
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: -1.0
